apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: todo-api

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  resources:
    - ref: todo-webapp-2-todo-db
      envBindings:
        dbname: TODO_DB_DBNAME
        host: TODO_DB_HOST
        password: TODO_DB_PASSWORD
        port: TODO_DB_PORT
        user: TODO_DB_USER
